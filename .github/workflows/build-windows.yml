# Lightweight fast-path build: compiles agentdock.exe (windows/amd64, CGO
# disabled) and uploads it as the agentdock-windows-amd64-exe artifact on
# every push to main that touches Go sources or this workflow file.
name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build agentdock.exe (windows/amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MCP tests
        run: go test ./internal/tool/mcp ./internal/mcp/client

      - name: Build agentdock.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o dist\agentdock.exe .\cmd\agentdock
          $hash = (Get-FileHash -LiteralPath dist\agentdock.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  agentdock.exe" | Out-File -FilePath dist\agentdock.exe.sha256 -Encoding ascii

      - name: Upload agentdock.exe
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-amd64-exe
          path: |
            dist/agentdock.exe
            dist/agentdock.exe.sha256
          retention-days: 14
