name: Cloud Build - AgentDock Windows GPT Actions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-amd64:
    name: Build Notion MCP compatible Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test Notion MCP compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/auth ./internal/httpx

      - name: Full Go test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...

      - name: Vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go vet ./...

      - name: Build AgentDock Windows amd64
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDate = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $sourceCommit = (git rev-parse HEAD).Trim()
          $ldflags = "-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=$sourceCommit -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=$buildDate"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -ldflags $ldflags -o dist/agentdock.exe ./cmd/agentdock
          & .\dist\agentdock.exe version --json

      - name: Hash artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -LiteralPath .\dist\agentdock.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('.\dist\agentdock.exe.sha256', "$hash  agentdock.exe`n", [Text.UTF8Encoding]::new($false))

      - name: Upload AgentDock executable
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-notion-mcp-windows-amd64
          path: |
            dist/agentdock.exe
            dist/agentdock.exe.sha256
          if-no-files-found: error
          retention-days: 7
